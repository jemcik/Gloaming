# Attaches the APK to a GitHub Release, whether the release was made by pushing
# a v* tag or by pressing "Create a new release" in the web UI.
#
# Releases exist here because workflow ARTIFACTS require a signed-in GitHub
# account to download, while release assets do not - so this is the one that
# gives anybody a link they can tap on a phone.
#
# It publishes the DEBUG APK, signed with the standard debug key. That is fine
# for handing builds to people to try, and is not suitable for Play: a release
# build needs a real keystore, which would go in repository secrets and get
# wired up here. Deliberately not done yet - see .gitignore, which already
# refuses to commit signing material.
name: release

on:
  push:
    tags: ['v*']
  release:
    types: [published]

# Creating a release from the web UI fires BOTH of the above - it pushes the tag
# and publishes the release - so two runs can start for the same tag. Queue them
# instead of cancelling, and the publish step below is idempotent either way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Install the compile SDK
        run: sdkmanager --install "platforms;android-37.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Name it after the tag
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/gloaming-${GITHUB_REF_NAME}-debug.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          # The release may already exist - that is the normal case when it was
          # made with the web UI's "Create a new release" button, which is why
          # this creates only when missing rather than unconditionally.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --notes "Debug build, signed with the standard Android debug key - installable for trying it out, not a Play Store build. Requires Android 15 (API 35) or newer."
          gh release upload "$TAG" dist/*.apk --clobber
