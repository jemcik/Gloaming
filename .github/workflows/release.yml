# Attaches the APK to a GitHub Release, whether the release was made by pushing
# a version tag or by pressing "Create a new release" in the web UI.
#
# Releases exist here because workflow ARTIFACTS require a signed-in GitHub
# account to download, while release assets do not - so this is the one that
# gives anybody a link they can tap on a phone.
#
# It publishes a RELEASE APK signed with a real keystore held in repository
# secrets. It used to publish the debug APK, and that was broken in a way only
# a second release could reveal: the runner generates a throwaway debug key per
# run, so 0.1 and 0.2 went out under different certificates and Android refused
# to install 0.2 over 0.1 - INSTALL_FAILED_UPDATE_INCOMPATIBLE, measured on the
# phone. A correct versionCode is necessary and not sufficient; a STABLE signing
# identity is the other half.
#
# Four secrets are required, and the job fails loudly rather than falling back
# to a debug key if the first is missing:
#   GLOAMING_KEYSTORE_BASE64    the .jks, base64-encoded
#   GLOAMING_KEYSTORE_PASSWORD
#   GLOAMING_KEY_ALIAS
#   GLOAMING_KEY_PASSWORD
# The keystore itself never enters the repo - see .gitignore, which has refused
# signing material since before any existed.
name: release

on:
  push:
    # BOTH styles, deliberately. This listened only for 'v*' while the repo's
    # own first tag was "0.1", so the tag path had never once fired - 0.1
    # shipped through the `release: published` event below, and pushing a bare
    # "0.2" would have done nothing at all. Rather than pick a convention and
    # silently ignore the other, both work.
    tags: ['v[0-9]*', '[0-9]*']
  release:
    types: [published]

# Creating a release from the web UI fires BOTH of the above - it pushes the tag
# and publishes the release - so two runs can start for the same tag. Queue them
# instead of cancelling, and the publish step below is idempotent either way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Install the compile SDK
        run: sdkmanager --install "platforms;android-37.0"

      - uses: gradle/actions/setup-gradle@v6

      # The version has to come from the TAG, not from build.gradle.kts, and the
      # reason is not cosmetic. Both values were hardcoded there, so every
      # release shipped versionCode 1 - and Android refuses to install an APK
      # whose versionCode is not HIGHER than the installed one. 0.1 installed
      # fine; 0.2 would have failed with "app not installed" for every person
      # who already had it. A release that upgrades nobody.
      #
      # MAJOR*10000 + MINOR*100 + PATCH keeps it monotonic with room to spare,
      # and starts above the 1 already published: 0.1 -> 100, 0.2 -> 200,
      # 1.0 -> 10000. Two digits per field, so 0.1.1 is 101 and not ambiguous.
      - name: Read the version out of the tag
        # Explicitly bash: this reads BASH_REMATCH, which zsh does not set (it
        # uses $match), so the same lines silently derive versionCode 0 there.
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]]; then
            echo "::error::Tag '$TAG' is not MAJOR.MINOR[.PATCH], so no versionCode can be derived from it. Tag as 0.2, v0.2, 0.2.1 or v0.2.1."
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[4]:-0}"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          echo "$TAG -> versionName $VERSION, versionCode $CODE"

      # Written to RUNNER_TEMP, not the workspace, so it cannot be picked up by
      # anything that archives the checkout.
      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.GLOAMING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::GLOAMING_KEYSTORE_BASE64 is not set. Releases must be signed with a stable key or they cannot be installed over the previous version. See the header of this workflow."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gloaming.jks"
          echo "GLOAMING_KEYSTORE=$RUNNER_TEMP/gloaming.jks" >> "$GITHUB_ENV"

      # BOTH artefacts, from one invocation and therefore one versionCode.
      # Google Play requires an Android App Bundle for new apps and will not
      # take an APK at all; the APK is still the only thing a person can tap on
      # a phone, so neither replaces the other. Building them in separate steps
      # would work and is a worse idea - two Gradle runs is two chances for the
      # version properties to differ.
      - name: Build the release APK and AAB
        env:
          GLOAMING_KEYSTORE_PASSWORD: ${{ secrets.GLOAMING_KEYSTORE_PASSWORD }}
          GLOAMING_KEY_ALIAS: ${{ secrets.GLOAMING_KEY_ALIAS }}
          GLOAMING_KEY_PASSWORD: ${{ secrets.GLOAMING_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease bundleRelease
          -PgloamingVersionName="$VERSION"
          -PgloamingVersionCode="$CODE"

      # The gate. An unsigned build is named app-release-unsigned.apk and
      # apksigner refuses it, so a missing or wrong key stops the release here
      # instead of publishing something nobody can upgrade to. The certificate
      # digest is printed so a change of signing identity is visible in the log
      # rather than discovered on a phone.
      - name: Refuse to publish an APK that is not signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          # An unsigned build is named app-release-UNSIGNED.apk, so the name
          # alone catches a missing key. Globbing *.apk would happily pick that
          # one up, and on a dirty tree could match both.
          if [ ! -f "$APK" ]; then
            echo "::error::$APK is missing. AGP writes app-release-unsigned.apk when no signing config is attached, so the keystore did not reach the build."
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      # The same gate for the bundle, and it needs its own: an unsigned AAB is
      # named app-release.aab exactly like a signed one, so unlike the APK the
      # FILENAME proves nothing here and only a verification can. apksigner does
      # not read bundles - jarsigner does, since an AAB is a jar underneath.
      - name: Refuse to publish a bundle that is not signed
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$AAB" ]; then
            echo "::error::$AAB is missing. bundleRelease did not produce a bundle."
            ls -la app/build/outputs/bundle/release/ || true
            exit 1
          fi
          if ! jarsigner -verify "$AAB" | grep -q 'jar verified'; then
            echo "::error::$AAB is not signed. Play rejects an unsigned bundle, and an upload key that changes cannot be recovered from."
            jarsigner -verify "$AAB" || true
            exit 1
          fi
          echo "AAB=$AAB" >> "$GITHUB_ENV"

      # Named from VERSION rather than the raw tag, so "0.2" and "v0.2" produce
      # the same asset name.
      - name: Name it after the version
        run: |
          mkdir -p dist
          cp "$APK" "dist/gloaming-${VERSION}.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          # The release may already exist - that is the normal case when it was
          # made with the web UI's "Create a new release" button, which is why
          # this creates only when missing rather than unconditionally.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --notes "Requires Android 15 (API 35) or newer. Signed with the project release key, so it installs over any earlier release of the same lineage."
          gh release upload "$TAG" dist/*.apk --clobber

      # The bundle goes to the WORKFLOW's artefacts, deliberately not to the
      # release. A release asset is public and needs no account, which is the
      # whole reason releases are used here - and an AAB cannot be installed by
      # anyone. Sitting next to the APK on a public page it is an invitation to
      # download the wrong file, which is already the one thing testers have to
      # be warned about. Downloading a workflow artefact needs a signed-in
      # GitHub account, which is exactly the audience for this file: whoever
      # uploads it to Play Console.
      - name: Keep the bundle for Play Console
        uses: actions/upload-artifact@v5
        with:
          name: gloaming-${{ env.VERSION }}-play-bundle
          path: ${{ env.AAB }}
          if-no-files-found: error
          retention-days: 90
